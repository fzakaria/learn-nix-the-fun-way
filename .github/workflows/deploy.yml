# Build the deck hermetically with Nix and publish it to GitHub Pages:
# the PDFs, the reveal.js build under reveal/, and a landing page --
# exactly the tree `nix run` serves locally (packages.site in flake.nix).
name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, but never
# cancels a deploy that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the site
        run: nix build .#site --print-build-logs

      # The store path is read-only symlinks; upload a real copy.
      - name: Stage
        run: cp -rL --no-preserve=mode result _site

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
